<div class="calendar-grid min-h-30 divide-y divide-purple-50">
  <!-- Time column -->
  <div class="p-4 border-r border-purple-100 text-xs font-semibold text-slate-400 text-center pt-6">
    {{time}}
  </div>

  <!-- Day slots -->
  <app-calendar-slot *ngFor="let day of days" [day]="day" [time]="time"></app-calendar-slot>
</div>
