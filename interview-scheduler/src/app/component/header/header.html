<header class="h-16 border-b border-slate-200 bg-white flex items-center justify-between px-8 shrink-0">
  <div class="flex items-center gap-4">
    <h2 class="text-xl font-bold text-slate-800">Schedule Overview</h2>
    <div
      class="flex items-center gap-2 text-sm text-primary bg-primary/10 px-3 py-1.5 rounded-lg font-medium"
    >
      <span class="material-symbols-outlined text-lg">event</span>
      Oct 23 - Oct 29, 2023
    </div>
  </div>
  <div class="flex items-center gap-3">
    <div class="relative">
      <span
        class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-slate-400 text-lg"
        >search</span
      >
      <input
        class="pl-9 pr-4 py-2 bg-slate-100 border-none rounded-lg text-sm w-64 focus:ring-2 focus:ring-primary/50 transition-all"
        placeholder="Search events..."
        type="text"
      />
    </div>
    <button class="p-2 text-slate-500 hover:bg-slate-100 rounded-lg relative">
      <span class="material-symbols-outlined">notifications</span>
      <span class="absolute top-2 right-2 size-2 bg-red-500 rounded-full ring-2 ring-white"></span>
    </button>
    <button
      class="flex items-center gap-2 bg-primary text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-primary/90 transition-all shadow-lg shadow-primary/20"
    >
      <span class="material-symbols-outlined text-lg">add</span>
      Book Interview
    </button>
  </div>
</header>
