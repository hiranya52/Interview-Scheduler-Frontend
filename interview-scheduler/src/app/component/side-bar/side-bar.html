<aside class="w-64 bg-deep-purple flex flex-col text-white h-screen">

  <!-- Header -->
  <div class="p-6 flex items-center gap-3">
    <div class="size-10 bg-primary rounded-lg flex items-center justify-center text-white">
      <span class="material-symbols-outlined text-2xl">event_upcoming</span>
    </div>
    <div>
      <h1 class="text-white font-bold leading-tight">InterviewSync</h1>
      <p class="text-xs text-purple-300 font-medium">Recruitment Portal</p>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 px-4 space-y-1">

    <!-- Dashboard -->
    <button
      type="button"
      class="w-full flex items-center gap-3 px-3 py-2 text-purple-100 hover:bg-white/10 rounded-lg group transition-colors"
      (click)="setView('Dashboard')"
    >
      <span class="material-symbols-outlined text-purple-300 group-hover:text-white transition-colors">
        dashboard
      </span>
      <span class="text-sm font-medium">Dashboard</span>
    </button>

    <!-- Calendar -->
    <button
      type="button"
      class="w-full flex items-center gap-3 px-3 py-2 bg-primary text-white rounded-lg transition-colors shadow-lg shadow-black/20"
      (click)="setView('Calendar')"
    >
      <span class="material-symbols-outlined">calendar_month</span>
      <span class="text-sm font-medium">Calendar</span>
    </button>

    <!-- Candidates -->
    <button
      type="button"
      class="w-full flex items-center gap-3 px-3 py-2 text-purple-100 hover:bg-white/10 rounded-lg group transition-colors"
      (click)="setView('Candidates')"
    >
      <span class="material-symbols-outlined text-purple-300 group-hover:text-white transition-colors">
        groups
      </span>
      <span class="text-sm font-medium">Candidates</span>
    </button>

    <!-- Interviewers -->
    <button
      type="button"
      class="w-full flex items-center gap-3 px-3 py-2 text-purple-100 hover:bg-white/10 rounded-lg group transition-colors"
      (click)="setView('Interviewer')"
    >
      <span class="material-symbols-outlined text-purple-300 group-hover:text-white transition-colors">
        badge
      </span>
      <span class="text-sm font-medium">Interviewers</span>
    </button>

    <!-- Settings -->
    <button
      type="button"
      class="w-full flex items-center gap-3 px-3 py-2 text-purple-100 hover:bg-white/10 rounded-lg group transition-colors"
      (click)="setView('Settings')"
    >
      <span class="material-symbols-outlined text-purple-300 group-hover:text-white transition-colors">
        settings
      </span>
      <span class="text-sm font-medium">Settings</span>
    </button>

  </nav>

  <!-- User panel -->
  <div class="p-4 border-t border-purple-900">
    <div class="flex items-center gap-3 p-2 bg-white/5 rounded-xl">
      <div class="size-8 rounded-full bg-purple-800 overflow-hidden ring-2 ring-purple-600">
        <img
          alt="User Profile"
          class="w-full h-full object-cover"
          src="https://lh3.googleusercontent.com/aida-public/AB6AXuACzQr5HBlHHkACT06Ogdz4UrVAViZ1jjQotUnPDnBQWU_blWlG_ZauS5SVZG92eDvU_O6Gcxas794wqfi0d3rr_XnV8i4bwc0X-Tdov1LQhk-OLLsSW5eJsb96ygDBHZHAof1SkZWu5hWhl8kcR3i9f4jiWVgL4e70Bj71YwDW1oFKCSyYONOYD5pisxttc75UdfjRK31XlgP0sWu9Kj37LZTuiNZpmHoIRSPou9xgyBk29fDXm6T0ruXzWooJi5Fb5Ojj4Z0z2-ZS"
        />
      </div>

      <div class="flex-1 min-w-0">
        <p class="text-xs font-semibold truncate text-white">Alex Rivera</p>
        <p class="text-[10px] text-purple-300 uppercase">HR Manager</p>
      </div>

      <button type="button" class="text-purple-300 hover:text-white">
        <span class="material-symbols-outlined text-xl">logout</span>
      </button>
    </div>
  </div>

</aside>
