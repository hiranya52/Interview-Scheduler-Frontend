<div class="fixed inset-0 bg-deep-purple/60 backdrop-blur-sm z-50 flex items-center justify-center p-4" [ngClass]="{'opacity-0 pointer-events-none': !isOpen, 'opacity-100': isOpen}">
  <div class="bg-white w-full max-w-lg rounded-xl shadow-2xl overflow-hidden border border-slate-200">
    <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-purple-50/50">
      <h3 class="text-lg font-bold text-deep-purple">Book New Interview</h3>
      <button class="text-slate-400 hover:text-slate-600" (click)="isOpen=false"><span class="material-symbols-outlined">close</span></button>
    </div>
    <div class="p-6 space-y-4">
      <!-- Form Fields like Candidate, Interviewer, Date, Time -->
      <!-- Copy inputs from your HTML -->
    </div>
    <div class="p-6 border-t border-slate-100 flex justify-end gap-3 bg-slate-50">
      <button class="px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-lg">Cancel</button>
      <button class="px-6 py-2 bg-primary text-white text-sm font-bold rounded-lg shadow-lg shadow-primary/20 hover:bg-primary/90 transition-colors">Confirm Booking</button>
    </div>
  </div>
</div>
