<header class="h-16 flex items-center justify-between px-8 bg-white/5 border-b border-white/5 top-0">
  <div class="flex items-center gap-4 flex-1 max-w-xl">
    <div class="relative w-full">
      <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[20px]">search</span>
      <input
        class="w-full bg-slate-100 dark:bg-white/5 border-none rounded-lg pl-10 pr-4 py-2 text-sm focus:ring-2 focus:ring-primary text-slate-900 dark:text-white placeholder-slate-400 transition-all"
        placeholder="Search candidates by name or email..."
        type="text"
      />
    </div>
  </div>
  <div class="flex items-center gap-3">
    <button class="size-10 flex items-center justify-center rounded-lg hover:bg-slate-200 dark:hover:bg-white/10 text-slate-500 dark:text-slate-400 relative">
      <span class="material-symbols-outlined">notifications</span>
      <span class="absolute top-2 right-2.5 size-2 bg-red-500 rounded-full border-2 border-background-dark"></span>
    </button>
    <button class="size-10 flex items-center justify-center rounded-lg hover:bg-slate-200 dark:hover:bg-white/10 text-slate-500 dark:text-slate-400">
      <span class="material-symbols-outlined">help_outline</span>
    </button>
  </div>
</header>
